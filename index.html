<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你好，我是 YZ。</title>
<style>
  :root {
    --rainbow: linear-gradient(90deg, #ff5f6d, #ffc371, #f6f669, #6ee7a8, #4facfe, #a78bfa, #ff8ad8, #ff5f6d);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #ffffff;
    color: #1b1b1f;
    font-family: "Arial Rounded MT Bold", "Avenir Next Rounded", "Nunito",
                 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
  }
  .stack { width: 100%; max-width: 760px; }

  .rainbow {
    background-image: var(--rainbow);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 14s ease-in-out infinite alternate;
  }
  @keyframes shine {
    from { background-position: 0% 50%; }
    to   { background-position: 200% 50%; }
  }

  h1 {
    font-size: clamp(30px, 6.2vw, 64px);
    font-weight: 800;
    letter-spacing: .5px;
    line-height: 1.25;
  }
  .tagline {
    margin-top: 16px;
    font-size: clamp(15px, 2.4vw, 22px);
    font-weight: 600;
    animation-delay: 4s;
  }

  .lower {
    margin-top: 7vh;
    padding: 30px 24px;
    border-radius: 24px;
    border: 0;
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    box-shadow: 0 8px 40px rgba(0, 0, 0, .04);
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation-delay: 7s;
  }
  .lower p { font-size: clamp(14px, 2.2vw, 19px); font-weight: 600; }
  .creed { margin-top: 16px; line-height: 2; font-weight: 600; }

  @media (max-width: 520px) {
    body { padding: 10vh 7vw; }
    .lower { margin-top: 5vh; padding: 24px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rainbow { animation: none; }
  }
</style>
</head>
<body>
  <main class="stack">
    <h1 class="rainbow">你好，我是 YZ。</h1>
    <p class="tagline rainbow">一个启航人。</p>

    <section class="lower">
      <p class="rainbow">我正就读于大湾区大学</p>
      <p class="rainbow">正在探索 AI</p>
      <p class="creed rainbow">保持好奇持续学习<br>让每一次尝试都成为新的启航</p>
    </section>
  </main>
</body>
</html>
